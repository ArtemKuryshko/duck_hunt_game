name: quality

on:
  create:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  quality:
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run flake8
        run: >
          python -m flake8
          src/config.py
          src/systems/score_system.py
          src/systems/trajectory_creator.py
          src/systems/settings_manager.py
          src/systems/point_manager.py
          src/systems/inventory_manager.py
          src/systems/level_manager.py
          tests

      - name: Run pytest
        run: python -m pytest
